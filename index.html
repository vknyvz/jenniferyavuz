    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: 'Marcellus', Georgia, serif;
      background: #060606;

      min-height: 100vh;

      align-items: center;
      justify-content: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
      box-sizing: border-box;

    .hero {
      position: relative;
      width: min(760px, 100%);
      aspect-ratio: 16 / 9;
      background: linear-gradient(125deg, #2c2c2e 0%, #2c2c2e 14%, #0a0a0c 28%, #050505 100%);
      overflow: hidden;
      border-radius: 16px;
    }
    .hero-accent {
      position: absolute;
      inset: 0;
      background: #efad55;
      clip-path: polygon(60% 0, 62% 0, 51% 100%, 42% 100%);
    }
    .hero-image {
      position: absolute;
      inset: 0;
      clip-path: polygon(62% 0, 100% 0, 100% 100%, 51% 100%);
    }
    .hero-image img {
      position: absolute;
      top: 0;
      right: 0;
      width: 50%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: brightness(1.08) contrast(0.92) saturate(1.05);
    }
    .hero-text {
      position: absolute;
      top: 50%;
      left: 6%;
      transform: translateY(-50%);
      z-index: 2;
      color: #fff;
      max-width: 42%;
    }
    .hero-text h1 {
      font-size: clamp(1.5rem, 3.6vw, 2.75rem);
      line-height: 1.15;
      font-weight: 700;
      margin: 0 0 0.75rem;
      letter-spacing: 0.02em;
    }
    .hero-text p {
      font-size: clamp(1rem, 1.8vw, 1.4rem);
      line-height: 1.3;
      margin: 0;
      letter-spacing: 0.03em;
      color: #e8e6e1;
    }
    .mob-br { display: none; }
    @media (max-width: 640px) {
      body { padding: 0; align-items: flex-start; }
      .hero { aspect-ratio: 5 / 4; }
      .hero-accent {
        clip-path: polygon(60% 0, 62% 0, 45% 100%, 36% 100%);
      }
      .hero-image {
        clip-path: polygon(62% 0, 100% 0, 100% 100%, 45% 100%);
      }
      .hero-image img {
        width: 60%;
      }
      .hero-text {
        max-width: 45%;
        left: 6%;
        top: 18%;
        transform: none;
      }
      .hero-text h1 { font-size: 1.5rem; }
      .hero-text p { font-size: 0.95rem; }
      .mob-br { display: initial; }
